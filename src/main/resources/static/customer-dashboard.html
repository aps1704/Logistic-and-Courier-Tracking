<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
<header>
    <h1>Customer Dashboard</h1>
    <button id="logoutButton">Log out</button>
</header>

<main>
    <section class="card">
        <h2>Book a Parcel</h2>

        <form id="customerCreateForm">
            <label for="sender">Sender name</label>
            <input id="sender" required maxlength="150">

            <label for="senderPhone">Sender phone (10 digits)</label>
            <input id="senderPhone" type="tel" inputmode="numeric"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label for="pickupAddress">Pickup address</label>
            <textarea id="pickupAddress" required maxlength="1000"></textarea>

            <label for="receiver">Receiver name</label>
            <input id="receiver" required maxlength="150">

            <label for="receiverPhone">Receiver phone (10 digits)</label>
            <input id="receiverPhone" type="tel" inputmode="numeric"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label for="deliveryAddress">Delivery address</label>
            <textarea id="deliveryAddress" required maxlength="1000"></textarea>

            <label for="weight">Parcel weight (kg)</label>
            <input id="weight" type="number" min="0.01" max="1000"
                   step="0.01" required>

            <button type="submit">Place Parcel Order</button>
            <p id="customerCreateMessage" role="status"></p>
        </form>
    </section>

    <section class="card">
        <h2>My Parcels</h2>

        <input id="customerSearch"
               placeholder="Search tracking ID or recipient">

        <select id="customerStatus">
            <option value="">All statuses</option>
            <option>Booked</option>
            <option>In Transit</option>
            <option>Out for Delivery</option>
            <option>Delivered</option>
            <option>Delayed</option>
            <option>Cancelled</option>
        </select>

        <div id="customerParcels"></div>
    </section>
</main>
</body>
</html>
